appId: com.anonymous.mobile
---
# Requires the fixed E2E test account (run e2e/scripts/seed-test-user.sh
# once against local Supabase before this flow) and local Supabase running.
#
# Uses testID selectors, not visible text, for the two inputs and the
# submit button: the password field's iOS autofill/quick-type suggestion
# UI was observed to swallow a text-matched tapOn + inputText pair
# silently (the field stayed empty even though both steps reported
# COMPLETED) -- id-based selectors sidestep that ambiguity entirely.
- launchApp:
    clearState: true
- tapOn:
    id: "login-phone-input"
- inputText: "+390000000900"
- tapOn:
    id: "login-password-input"
- inputText: "MaestroTest123!"
- tapOn:
    id: "login-submit-button"
# Two independent system dialogs can appear after login, in either order --
# iOS's own "Save Password?" prompt (after a real secure-field submit), and
# the notification-permission prompt useRegisterPushToken fires (see the
# notifiche-push plan). Neither is guaranteed to appear (a device/run where
# iOS skips one, or a re-run where permission was already decided), and
# when both appear, dismissing one reveals the other underneath it -- so
# try each dismiss twice, covering every ordering, all as optional taps.
- tapOn:
    text: "Non ora"
    optional: true
- tapOn:
    text: "Non consentire"
    optional: true
- tapOn:
    text: "Non ora"
    optional: true
- tapOn:
    text: "Non consentire"
    optional: true
# React Navigation's bottom tab bar gives each tab a composite accessibility
# label ("Home, tab, 1 of 5"), not just its visible text -- Maestro's text
# assertions match the whole label, so a plain "Home" assertion fails even
# though the tab is genuinely on screen. Regex-wrap every tab assertion.
- assertVisible: ".*Home.*"
- assertVisible: ".*Le mie part.*"
- assertVisible: ".*Persone.*"
- assertVisible: ".*Messaggi.*"
- assertVisible: ".*Profilo.*"
